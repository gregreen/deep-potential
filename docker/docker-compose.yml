# GPU JupyterLab for Deep Potential (JAX)
#
# Usage:
#   docker compose up -d
#   # Open http://localhost:8888 in your browser
#
# Prerequisites:
#   - NVIDIA Container Toolkit (nvidia-docker2)
#   - Docker Compose v2+
#
# The project directory is mounted as /workspace inside the container.
# Any changes made in Jupyter are reflected on the host immediately.

services:
  jupyterlab:
    image: nvidia/cuda:12.3.1-devel-ubuntu22.04
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - XLA_PYTHON_CLIENT_PREALLOCATE=false
    ports:
      - "8888:8888"
    volumes:
      - ..:/workspace
    working_dir: /workspace
    command: >
      bash -c "
        apt-get update && apt-get install -y python3 python3-pip &&
        pip3 install --upgrade pip &&
        pip3 install 'jax[cuda12]' &&
        pip3 install -e '.[notebook]' &&
        jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root
          --NotebookApp.token='' --NotebookApp.password=''
      "
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
