seed: 1

data:
  dataset: eta

normalizer:
  eps: 1.0e-6

potential:
  hidden_sizes: [512, 512, 512, 512]

train:
  batch_size: 2048
  epochs: 1024
  loss_type: robust
  alpha: 1.0
  beta: 1.0
  lambda_mass: 1.0
  l2_reg: 0.1
  lr:
    max: 0.05
    final: 5.0e-6
    warmup_frac: 0.1
  grad_clip: 1.0
  log_every: 50
  ckpt_every: 200
