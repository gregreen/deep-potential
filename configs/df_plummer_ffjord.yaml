seed: 0

data:
  dataset: eta
  val_frac: 0.1

normalizer:
  eps: 1.0e-6

flow:
  type: ffjord
  dim: 6
  ffjord:
    hidden_sizes: [128, 128, 128]
    n_blocks: 3
    solver: tsit5
    rtol: 1.0e-5
    atol: 1.0e-5
    trace_type: exact
    dt0: 0.01
    max_steps: 4096
    # Finlay et al. (2020) regularisation — prevents ODE complexity explosion
    kin_reg: 2.0e-4
    jac_reg: 2.0e-4

train:
  batch_size: 4096
  epochs: 96
  lr:
    max: 0.003
    final: 0.0002
    warmup_frac: 0.1
  grad_clip: 1.0
  log_every: 50
  ckpt_every: 200
